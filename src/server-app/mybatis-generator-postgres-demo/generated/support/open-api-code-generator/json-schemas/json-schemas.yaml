openapi: 3.1.1
info:
  description: Json Schema for database jsonb columns
  version: 1.0.0
  title: Json Schema for database jsonb columns
components:
  schemas:
    user_profile:
      type: object
      properties:
        family_name:
          type: string
        given_name:
          type: string
        gender:
          type: string
          enum:
            - male
            - female
            - other
        birthday:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/address'
    address:
      type: object
      properties:
        formatted:
          type: string
        street_address:
          type: string
        locality:
          description: 'city, locality'
          type: string
        region:
          description: 'state, province, prefecture, region'
          type: string
        postal_code:
          type: string
        country:
          type: string
